<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile Card</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Colors */
      --ink-900: #141d33; /* page background */
      --ink-800: #1b2a4a; /* panel background */
      --ink-700: #2a3b63; /* borders / hairlines on ink */
      --parchment: #faf6ee; /* card background */
      --parchment-dim: #f1ead9;
      --gold: #c9a24b; /* primary accent */
      --gold-soft: #e4c983;
      --text-on-ink: #e9e6dc;
      --text-muted-on-ink: #9aa4bd;
      --text-ink-dark: #2b2620;
      --text-ink-muted: #7a7266;

      /* Grade colors */
      --grade-great: #2f7a4f; /* A+ / A */
      --grade-good: #b8862e; /* B */
      --grade-ok: #c0622a; /* C */
      --grade-fail: #b23a3a; /* Fail */

      /* Fonts */
      --font-display: "Fraunces", serif;
      --font-body: "Inter", sans-serif;
      --font-mono: "IBM Plex Mono", monospace;

      /* Layout & Shadows */
      --radius-lg: 20px;
      --radius-md: 12px;
      --shadow-panel: 0 20px 50px -20px rgba(0, 0, 0, 0.5);
      --shadow-card: 0 30px 60px -25px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--ink-900);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(201, 162, 75, 0.08), transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(201, 162, 75, 0.06), transparent 45%);
      font-family: var(--font-body);
      color: var(--text-on-ink);
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 48px 20px 64px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
      align-items: start;
    }

    .ledger {
      background: var(--ink-800);
      border: 1px solid var(--ink-700);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      box-shadow: var(--shadow-panel);
    }

    .ledger__eyebrow {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-soft);
      margin-bottom: 10px;
    }

    .ledger__title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.9rem;
      margin: 0 0 8px;
      color: var(--text-on-ink);
    }

    .ledger__subtitle {
      margin: 0 0 26px;
      font-size: 0.92rem;
      line-height: 1.5;
      color: var(--text-muted-on-ink);
    }

    .ledger__form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.78rem;
      letter-spacing: 0.03em;
      color: var(--text-muted-on-ink);
    }

    .field input {
      font-family: var(--font-body);
      font-size: 0.98rem;
      color: var(--text-on-ink);
      background: var(--ink-900);
      border: 1px solid var(--ink-700);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field input::placeholder {
      color: #5b6480;
    }

    .field input:focus-visible {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 162, 75, 0.2);
    }

    .btn {
      margin-top: 8px;
      padding: 13px 20px;
      border: none;
      border-radius: var(--radius-md);
      background: linear-gradient(180deg, var(--gold-soft), var(--gold));
      color: #241b06;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px -8px rgba(201, 162, 75, 0.5);
      filter: brightness(1.04);
    }

    .btn:active {
      transform: translateY(0);
    }

    .cardslot {
      display: flex;
    }

    .profile-card {
      position: relative;
      width: 100%;
      min-height: 420px;
      background: var(--parchment);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .profile-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 36px 70px -25px rgba(0, 0, 0, 0.5);
    }

    .profile-card__empty-state {
      text-align: center;
      color: var(--text-ink-muted);
      padding: 40px;
    }

    .empty-mark {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      border: 1px dashed #c8bda2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #b7ab8b;
    }

    .profile-card__empty-state p {
      margin: 0 0 6px;
      font-family: var(--font-display);
      font-size: 1.15rem;
      color: var(--text-ink-dark);
    }

    .profile-card__empty-state span {
      font-size: 0.85rem;
      color: var(--text-ink-muted);
    }

    .profile-card__content {
      width: 100%;
      height: 100%;
    }

    .profile-card__band {
      height: 10px;
      width: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-soft), var(--gold));
    }

    .profile-card__body {
      padding: 34px 32px 30px;
    }

    .profile-card__label {
      margin: 0 0 6px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #a3925e;
    }

    .profile-card__name {
      margin: 0 0 4px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.7rem;
      color: var(--text-ink-dark);
      word-break: break-word;
    }

    .profile-card__roll {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      color: var(--text-ink-muted);
    }

    .profile-card__divider {
      height: 1px;
      background: repeating-linear-gradient(
        90deg, #d9cfb5 0,
        #d9cfb5 6px,
        transparent 6px,
        transparent 12px
      );
      margin: 22px 0;
    }

    .profile-card__stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat__label {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-ink-muted);
    }

    .stat__value {
      font-family: var(--font-mono);
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--text-ink-dark);
    }

    .stat--seal {
      align-items: flex-end;
    }

    .seal {
      --seal-color: var(--grade-ok);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2.5px solid var(--seal-color);
      color: var(--seal-color);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
      transform: rotate(-8deg) scale(0.6);
      opacity: 0;
      box-shadow: inset 0 0 0 3px rgba(0, 0, 0, 0.03);
    }

    .seal.is-stamped {
      animation: stamp 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
    }

    .profile-card__remark {
      margin: 22px 0 0;
      font-size: 0.85rem;
      color: var(--text-ink-muted);
      font-style: italic;
    }

    @keyframes fadeInCard {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .profile-card--reveal {
      animation: fadeInCard 0.5s ease forwards;
    }

    @keyframes stamp {
      0% {
        opacity: 0;
        transform: rotate(-8deg) scale(0.5);
      }
      60% {
        opacity: 1;
        transform: rotate(-8deg) scale(1.08);
      }
      100% {
        opacity: 1;
        transform: rotate(-8deg) scale(1);
      }
    }

    @media (min-width: 780px) {
      .page {
        grid-template-columns: 0.95fr 1.05fr;
        padding-top: 72px;
        gap: 36px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .profile-card--reveal,
      .seal.is-stamped {
        animation: none !important;
      }
    }

    @media (max-width: 480px) {
      .ledger {
        padding: 26px 20px;
      }
      .profile-card__body {
        padding: 28px 22px 24px;
      }
      .profile-card__stats {
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <main class="page">
    <!-- ===== Form Panel ===== -->
    <section class="ledger" aria-labelledby="form-title">
      <header class="ledger__header">
        <span class="ledger__eyebrow">Registrar's Office</span>
        <h1 id="form-title" class="ledger__title">Student Profile</h1>
        <p class="ledger__subtitle">Enter a student's record to generate their profile card.</p>
      </header>

      <form id="profileform" class="ledger__form" novalidate>
        <div class="field">
          <label for="studentName">Student Name</label>
          <input type="text" id="studentName" name="studentName" placeholder="e.g. Levi Ackerman" autocomplete="off" />
        </div>
        <div class="field">
          <label for="rollNumber">Roll Number</label>
          <input type="text" id="rollNumber" name="rollNumber" placeholder="e.g. 24CS041" autocomplete="off" />
        </div>
        <div class="field">
          <label for="marks">Marks (out of 100)</label>
          <input type="number" id="marks" name="marks" placeholder="e.g. 87" min="0" max="100" autocomplete="off" />
        </div>
        <button type="submit" id="displayBtn" class="btn">Display Profile</button>
      </form>
    </section>

    <!-- ===== Profile Card Slot ===== -->
    <section class="cardslot" aria-live="polite">
      <article id="profileCard" class="profile-card profile-card--empty">
        <!-- Empty state -->
        <div class="profile-card__empty-state" id="emptyState">
          <div class="empty-mark">＋</div>
          <p>No profile yet</p>
          <span>Fill the form and press "Display Profile" to see it here.</span>
        </div>

        <!-- Generated content -->
        <div class="profile-card__content" id="cardContent" hidden>
          <div class="profile-card__band"></div>
          <div class="profile-card__body">
            <p class="profile-card__label">Student Record</p>
            <h2 class="profile-card__name" id="outName">—</h2>
            <p class="profile-card__roll" id="outRoll">Roll No. —</p>

            <div class="profile-card__divider"></div>

            <div class="profile-card__stats">
              <div class="stat">
                <span class="stat__label">Marks</span>
                <span class="stat__value" id="outMarks">—</span>
              </div>
              <div class="stat stat--seal">
                <span class="stat__label">Grade</span>
                <span class="seal" id="outGrade">—</span>
              </div>
            </div>

            <p class="profile-card__remark" id="outRemark"></p>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const form = document.getElementById('profileform');
    const nameInput = document.getElementById('studentName');
    const rollInput = document.getElementById('rollNumber');
    const marksInput = document.getElementById('marks');
    const profileCard = document.getElementById('profileCard');
    const emptyState = document.getElementById('emptyState');
    const cardContent = document.getElementById('cardContent');
    const outName = document.getElementById('outName');
    const outRoll = document.getElementById('outRoll');
    const outMarks = document.getElementById('outMarks');
    const outGrade = document.getElementById('outGrade');
    const outRemark = document.getElementById('outRemark');

    const GRADE_RULES = [
      { min: 90, label: 'A+', color: 'var(--grade-great)', remark: 'Outstanding performance.' },
      { min: 80, label: 'A', color: 'var(--grade-great)', remark: 'Excellent work.' },
      { min: 70, label: 'B', color: 'var(--grade-good)', remark: 'Good, solid performance.' },
      { min: 60, label: 'C', color: 'var(--grade-ok)', remark: 'Satisfactory — room to improve.' },
      { min: -Infinity, label: 'Fail', color: 'var(--grade-fail)', remark: 'Did not meet the passing mark.' }
    ];

    /**
     * Returns matching grade rule based on marks
     * @param {number} marks
     * @returns {{min:number, label:string, color:string, remark:string}}
     */
    function getGrade(marks) {
      return GRADE_RULES.find((rule) => marks >= rule.min);
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const name = nameInput.value.trim();
      const roll = rollInput.value.trim();
      const marksRaw = marksInput.value.trim();

      if (!name || !roll || !marksRaw) {
        alert('Please complete all fields before displaying the profile.');
        return;
      }

      const marks = Number(marksRaw);
      if (Number.isNaN(marks) || marks < 0 || marks > 100) {
        alert('Please enter a valid mark between 0 and 100.');
        return;
      }

      renderProfile({ name, roll, marks });
    });

    function renderProfile(student) {
      const grade = getGrade(student.marks);

      outName.textContent = student.name;
      outRoll.textContent = `Roll No. ${student.roll}`;
      outMarks.textContent = student.marks;
      outRemark.textContent = grade.remark;
      outGrade.textContent = grade.label;

      outGrade.style.setProperty('--seal-color', grade.color);
      outGrade.classList.remove('is-stamped');

      // Force reflow so stamp animation can restart
      void outGrade.offsetWidth; 

      outGrade.classList.add('is-stamped');

      emptyState.hidden = true;
      cardContent.hidden = false;

      profileCard.classList.remove('profile-card--empty');
      profileCard.classList.remove('profile-card--reveal');

      // Trigger card entrance animation
      void profileCard.offsetWidth;
      profileCard.classList.add('profile-card--reveal');
    }
  </script>
</body>
</html>
